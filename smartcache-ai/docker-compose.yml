services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartcache_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-smartcache_user}:${POSTGRES_PASSWORD:-smartcache_password}@postgres:5432/${POSTGRES_DB:-smartcache}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartcache_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - backend

  redis:
    image: redis:alpine
    container_name: smartcache_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: smartcache_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartcache}
      POSTGRES_USER: ${POSTGRES_USER:-smartcache_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartcache_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartcache_user} -d ${POSTGRES_DB:-smartcache}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
